name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip app sources
        run: |
          if [ -f app.zip ]; then unzip -oq app.zip; fi
          ls app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

          
      - name: Build debug APK
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -E "^e: |^w: .*error|What went wrong" -A6 build.log | head -60
            echo "=========== LAST 40 LINES ==========="
            tail -40 build.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AIM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AIM-debug.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AIM-debug.apk --prerelease \
            --title "AIM latest build" \
            --notes "Debug build" \
            --target "${{ github.sha }}"
